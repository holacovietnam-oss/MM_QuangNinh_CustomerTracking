<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#b91c1c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="MM Customer Tracking"><link rel="manifest" href="manifest.json"><title>MM Customer Tracking</title><style>
:root{--red:#b91c1c;--red2:#991b1b;--bg:#f5f6f8;--card:#fff;--text:#172033;--muted:#667085;--line:#e5e7eb;--ok:#047857;--warn:#b45309;--danger:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:900px;margin:auto;min-height:100vh}.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:2px}.content{padding:16px 16px 90px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-size:13px;font-weight:650}input,select,textarea{width:100%;border:1px solid #d0d5dd;border-radius:10px;padding:11px 12px;background:#fff;color:var(--text);outline:none}textarea{min-height:90px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(185,28,28,.1)}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;font-weight:750}.btn.primary{background:var(--red);border-color:var(--red);color:#fff}.btn.ghost{background:#fff}.btn.danger{color:var(--danger)}.actions{display:flex;gap:8px;flex-wrap:wrap}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.tab{padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:700}.tab.active{background:#fee2e2;border-color:#fecaca;color:var(--red2)}.metricgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{padding:13px;border:1px solid var(--line);border-radius:14px;background:#fff}.metric .v{font-size:24px;font-weight:850;margin-top:4px}.metric .l{font-size:12px;color:var(--muted)}.hidden{display:none!important}.pill{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:750;background:#f2f4f7}.pill.ok{background:#ecfdf3;color:var(--ok)}.pill.bad{background:#fef3f2;color:var(--danger)}.notice{padding:10px 12px;border-radius:10px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;font-size:13px}.success{padding:10px 12px;border-radius:10px;background:#ecfdf3;border:1px solid #a7f3d0;color:#065f46;font-size:13px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:12px;vertical-align:top}th{background:#f8fafc;color:var(--muted)}.small{font-size:12px;color:var(--muted)}.footer{color:var(--muted);font-size:11px;text-align:center;margin-top:20px}.sectiontitle{font-size:16px;font-weight:800;margin-bottom:12px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.bar{height:9px;background:#eef2f6;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--red);border-radius:99px}.reason{margin-top:8px}.login{max-width:460px;margin:10vh auto;padding:20px}.logo{width:48px;height:48px;border-radius:14px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px;margin-bottom:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}.metricgrid{grid-template-columns:repeat(2,1fr)}.content{padding:12px 12px 90px}.top{padding:10px 12px}.login{margin:4vh auto}.tabs{position:sticky;top:65px;z-index:5}}
</style></head><body><div id="root"></div><script src="data.js"></script><script>
(()=>{
const D=window.APP_DATA; const KEY='mm_customer_records_v1'; const CFG='mm_customer_cfg_v1';
const state={tab:'entry',records:load(),staff:null};
const root=document.getElementById('root');
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(state.records))}
function money(n){return new Intl.NumberFormat('vi-VN').format(n||0)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){return new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10)}
function centers(){return [...new Set(D.staff.map(x=>x.center))].sort()}
function staffOptions(center=''){return D.staff.filter(x=>!center||x.center===center)}
function shell(){root.innerHTML=`<div class="app"><div class="top"><div class="brand">MM CUSTOMER TRACKING<small>Khách tham khảo → Chốt đơn</small></div><button class="btn ghost" id="who">${state.staff?esc(state.staff.name):'Chọn nhân viên'}</button></div><div class="content" id="view"></div><div class="footer">MediaMart Quảng Ninh • Phiên bản 1.0 • Dữ liệu trên thiết bị</div></div>`; document.getElementById('who').onclick=()=>showLogin(true); render()}
function showLogin(change=false){root.innerHTML=`<div class="login"><div class="logo">MM</div><h1 style="margin:0 0 6px">${change?'Đổi nhân viên':'MM Customer Tracking'}</h1><p class="small">Chọn đúng mã nhân viên để dữ liệu xuất Excel chính xác.</p><div class="card"><div class="field"><label>Trung tâm</label><select id="lc"><option value="">Chọn trung tâm</option>${centers().map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="field" style="margin-top:12px"><label>Nhân viên / PG</label><select id="ls" disabled><option>Chọn trung tâm trước</option></select></div><button class="btn primary" id="go" style="width:100%;margin-top:14px">Vào ứng dụng</button></div></div>`;
const lc=document.getElementById('lc'),ls=document.getElementById('ls'); lc.value=state.staff?.center||''; function fill(){const arr=staffOptions(lc.value);ls.disabled=!lc.value;ls.innerHTML=lc.value?'<option value="">Chọn nhân viên</option>'+arr.map((x,i)=>`<option value="${i}">${esc(x.code)} • ${esc(x.name)} • ${x.type}</option>`).join(''):'<option>Chọn trung tâm trước</option>'}; lc.onchange=fill; fill(); if(state.staff){const idx=staffOptions(state.staff.center).findIndex(x=>x.code===state.staff.code);if(idx>=0)ls.value=idx}
 document.getElementById('go').onclick=()=>{if(!lc.value||ls.value===''){alert('Vui lòng chọn trung tâm và nhân viên.');return}state.staff=staffOptions(lc.value)[Number(ls.value)];shell()};}
function render(){if(!state.staff){showLogin();return}const v=document.getElementById('view'); if(state.tab==='entry')entry(v); else if(state.tab==='dash')dash(v); else records(v); document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{state.tab=x.dataset.tab;render()})}
function tabs(){return `<div class="tabs"><button class="tab ${state.tab==='entry'?'active':''}" data-tab="entry">Nhập dữ liệu</button><button class="tab ${state.tab==='dash'?'active':''}" data-tab="dash">Tổng quan</button><button class="tab ${state.tab==='records'?'active':''}" data-tab="records">Dữ liệu</button></div>`}
function entry(v){v.innerHTML=tabs()+`<div class="card"><div class="sectiontitle">Ghi nhận khách tham khảo</div><div class="grid"><div class="field"><label>Ngày</label><input id="date" type="date" value="${today()}"></div><div class="field"><label>Nhân viên</label><input value="${esc(state.staff.code+' • '+state.staff.name)}" disabled></div><div class="field"><label>Ngành hàng</label><select id="cat"><option value="">Chọn ngành hàng</option>${D.categories.map(c=>`<option value="${c.code}">${c.code} • ${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Số khách tham khảo</label><input id="total" type="number" min="0" step="1" value="1"></div><div class="field"><label>Số khách chốt được</label><input id="closed" type="number" min="0" step="1" value="0"></div><div class="field"><label>Không chốt được</label><input id="not" value="1" disabled></div><div class="field full hidden" id="reasonWrap"><label>Lý do không chốt</label><select id="reason"><option value="">Chọn lý do</option><option>Giá cao</option><option>Khách tham khảo thêm</option><option>Chưa quyết định</option><option>Chưa có nhu cầu ngay</option><option>Không đủ tài chính</option><option>Không có sản phẩm phù hợp</option><option>Hết hàng</option><option>Khác</option></select></div><div class="field full hidden" id="noteWrap"><label>Ghi chú sau khi khách không lựa chọn mua <span style="color:var(--danger)">*</span></label><textarea id="note" placeholder="Mô tả ngắn: khách đang so sánh, mức giá mong muốn, hẹn quay lại, model quan tâm..."></textarea></div></div><div class="actions" style="margin-top:14px"><button class="btn primary" id="saveBtn">✓ Lưu dữ liệu</button><button class="btn" id="resetBtn">Nhập lại</button></div><div id="msg" style="margin-top:10px"></div></div><div class="card"><div class="sectiontitle">Quy tắc nhập</div><div class="small">Nếu có khách không chốt, nhân viên bắt buộc chọn <b>lý do</b> và ghi <b>ghi chú chi tiết</b>. Số không chốt tự động = khách tham khảo − khách chốt.</div></div>`; const total=document.getElementById('total'),closed=document.getElementById('closed'),not=document.getElementById('not'),rw=document.getElementById('reasonWrap'),nw=document.getElementById('noteWrap');function calc(){let a=Math.max(0,parseInt(total.value)||0),b=Math.max(0,parseInt(closed.value)||0);if(b>a){b=a;closed.value=a}not.value=a-b;rw.classList.toggle('hidden',a-b===0);nw.classList.toggle('hidden',a-b===0)}total.oninput=calc;closed.oninput=calc;calc();document.getElementById('resetBtn').onclick=()=>{document.getElementById('cat').value='';total.value=1;closed.value=0;document.getElementById('reason').value='';document.getElementById('note').value='';calc()};document.getElementById('saveBtn').onclick=()=>{const a=parseInt(total.value)||0,b=parseInt(closed.value)||0,n=a-b,cat=document.getElementById('cat').value;if(a<=0||!cat){alert('Vui lòng chọn ngành hàng và nhập số khách tham khảo.');return}if(b<0||b>a){alert('Số khách chốt không hợp lệ.');return}const reason=document.getElementById('reason').value,note=document.getElementById('note').value.trim();if(n>0&&(!reason||!note)){alert('Khách không chốt: bắt buộc nhập lý do và ghi chú.');return}const c=D.categories.find(x=>String(x.code)===cat);state.records.unshift({id:Date.now(),date:document.getElementById('date').value,center:state.staff.center,staffCode:state.staff.code,staffName:state.staff.name,type:state.staff.type,catCode:c.code,category:c.name,total:a,closed:b,notClosed:n,reason:reason,note:note,createdAt:new Date().toISOString()});save();document.getElementById('msg').innerHTML='<div class="success">✓ Đã lưu dữ liệu thành công.</div>';setTimeout(()=>document.getElementById('msg').innerHTML='',2500);document.getElementById('cat').value='';total.value=1;closed.value=0;document.getElementById('reason').value='';document.getElementById('note').value='';calc()}}
function dash(v){const mine=state.records.filter(r=>r.staffCode===state.staff.code);const total=mine.reduce((s,r)=>s+r.total,0),closed=mine.reduce((s,r)=>s+r.closed,0),not=mine.reduce((s,r)=>s+r.notClosed,0);const rate=total?((closed/total)*100).toFixed(1):'0.0';const byCat={};mine.forEach(r=>{byCat[r.category]??={t:0,c:0};byCat[r.category].t+=r.total;byCat[r.category].c+=r.closed});const cats=Object.entries(byCat).sort((a,b)=>b[1].t-a[1].t);v.innerHTML=tabs()+`<div class="card"><div class="row"><div><div class="sectiontitle" style="margin:0">Tổng quan của tôi</div><div class="small">${esc(state.staff.name)} • ${esc(state.staff.center)}</div></div><span class="pill">${esc(state.staff.type)}</span></div><div class="metricgrid" style="margin-top:14px"><div class="metric"><div class="l">KH tham khảo</div><div class="v">${total}</div></div><div class="metric"><div class="l">Chốt</div><div class="v">${closed}</div></div><div class="metric"><div class="l">Không chốt</div><div class="v">${not}</div></div><div class="metric"><div class="l">Tỷ lệ chốt</div><div class="v">${rate}%</div></div></div></div><div class="card"><div class="sectiontitle">Theo ngành hàng</div>${cats.length?cats.map(([n,x])=>`<div style="margin:12px 0"><div class="row"><span>${esc(n)}</span><b>${x.c}/${x.t}</b></div><div class="bar" style="margin-top:6px"><i style="width:${x.t?Math.min(100,x.c/x.t*100):0}%"></i></div></div>`).join(''):'<div class="small">Chưa có dữ liệu.</div>'}</div><div class="card"><div class="actions"><button class="btn primary" id="export">Xuất Excel dữ liệu của tôi</button><button class="btn" id="backup">Sao lưu JSON</button></div><div class="small" style="margin-top:8px">File Excel xuất dạng .xls, mở trực tiếp bằng Microsoft Excel.</div></div>`;document.getElementById('export').onclick=()=>exportExcel(mine,'MM_KhachThamKhao_'+state.staff.code+'_'+today()+'.xls');document.getElementById('backup').onclick=()=>download(JSON.stringify(mine,null,2),'MM_backup_'+state.staff.code+'_'+today()+'.json','application/json')}
function records(v){let rows=state.records.filter(r=>r.staffCode===state.staff.code);v.innerHTML=tabs()+`<div class="card"><div class="row"><div><div class="sectiontitle" style="margin:0">Dữ liệu đã nhập</div><div class="small">${rows.length} dòng • ${esc(state.staff.code)} • ${esc(state.staff.name)}</div></div><button class="btn danger" id="clear">Xóa dữ liệu của tôi</button></div><div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>Ngày</th><th>Ngành hàng</th><th>KH</th><th>Chốt</th><th>Không</th><th>Lý do</th><th>Ghi chú</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.catCode+' • '+r.category)}</td><td>${r.total}</td><td>${r.closed}</td><td>${r.notClosed}</td><td>${esc(r.reason||'-')}</td><td>${esc(r.note||'-')}</td></tr>`).join('')}</tbody></table></div></div>`;document.getElementById('clear').onclick=()=>{if(confirm('Xóa toàn bộ dữ liệu đã lưu trên thiết bị cho nhân viên này?')){state.records=state.records.filter(r=>r.staffCode!==state.staff.code);save();render()}}}
function exportExcel(rows,name){let h='<html><head><meta charset="UTF-8"></head><body><table border="1"><tr><th>Ngày</th><th>Mã trung tâm</th><th>Mã NV</th><th>Họ tên</th><th>Loại</th><th>CODE ngành hàng</th><th>Ngành hàng</th><th>KH tham khảo</th><th>Chốt</th><th>Không chốt</th><th>Lý do không chốt</th><th>Ghi chú</th></tr>';rows.forEach(r=>h+=`<tr><td>${esc(r.date)}</td><td>${esc(r.center)}</td><td>${esc(r.staffCode)}</td><td>${esc(r.staffName)}</td><td>${esc(r.type)}</td><td>${r.catCode}</td><td>${esc(r.category)}</td><td>${r.total}</td><td>${r.closed}</td><td>${r.notClosed}</td><td>${esc(r.reason)}</td><td>${esc(r.note)}</td></tr>`);h+='</table></body></html>';download('\ufeff'+h,name,'application/vnd.ms-excel')}
function download(content,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});shell();
})();</script></body></html>
